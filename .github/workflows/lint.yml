name: Lint

on: [pull_request]

jobs:
  ruff:
    runs-on: ubuntu-latest
    name: "ruff"
    steps:
      - uses: actions/checkout@v4
      - uses: chartboost/ruff-action@v1
        with:
          src: "./dsgrid"

  ty:
    runs-on: ubuntu-latest
    name: "ty"
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install --upgrade pip
          pip install maturin
          # spark extra is required so ty can resolve the conditional
          # ``import pyspark.sql.*`` statements in dsgrid/ibis/session.py.
          # Without it, ty fails with unresolved-import on the Spark branch
          # (which is dead code on DuckDB but ty type-checks both branches).
          pip install -e '.[dev,spark]'
      - name: Run ty check
        run: |
          source .venv/bin/activate
          ty check

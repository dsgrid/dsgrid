repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.3.0
    hooks:
      - id: trailing-whitespace
        exclude: dsgrid/utils/py_expression_eval/
      - id: end-of-file-fixer
      - id: check-added-large-files
        args: ["--maxkb=50000"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.2.1
    hooks:
      # Run the linter.
      - id: ruff
        args: [ --fix ]
        exclude: dsgrid/utils/py_expression_eval/.*
      # Run the formatter.
      - id: ruff-format
        exclude: dsgrid/utils/py_expression_eval/.*

  - repo: local
    hooks:
      # Run ty against the project's installed environment (matches CI's `ty check`).
      # Uses the active venv rather than an isolated one so third-party types resolve;
      # scope is inherited from [tool.ty.src] in pyproject.toml.
      - id: ty
        name: ty check
        entry: ty check
        language: system
        pass_filenames: false
        types: [python]

[package]
name = "dsgrid-patterns"
version = "0.4.0"
edition = "2021"

[lib]
name = "minimal_patterns"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29.0", features = ["extension-module"] }
arrow = { version = "60.1", default-features = false }
parquet = "60.1"
roaring = "0.10"
rayon = "1.8"
ahash = "0.8"
anyhow = "1.0"
